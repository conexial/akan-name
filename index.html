<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akan-name-generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Akan Name Generator</h1>

    <p>
      Enter your birth date and gender to find out the day you were born
      and your Akan name from Ghanaian culture.
    </p>
<!-- input form for user to enter their birth date -->
  <div class="form">
    <form id="akanForm">
      <label for="day">Day</label>
      <input type="number" id="day">

      <label for="month">Month</label>
      <input type="number" id="month">

      <label for="year">Year</label>
      <input type="number" id="year">

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <button type="submit">Get Akan Name</button>
    </form>
  </div>
    <!-- to display the result -->
    <div id="result">
     <h2>Results</h2>
     <p>Name: <span id="nameOutput"></span></p>
     <p>Gender: <span id="genderOutput"></span></p>
     <p>Day: <span id="dayOutput"></span></p>
  </div>

  <footer>
    <p>&copy; 2026 Akan Name Generator. All rights reserved.</p>
    <p>system done by Joe k</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
